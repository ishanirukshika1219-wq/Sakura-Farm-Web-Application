<!doctype html>
<html data-bs-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body class="bg-body-tertiary">
    <nav class="navbar navbar-expand-lg bg-success navbar-dark sticky-top">
      <div class="container">
        <a class="navbar-brand" href="index.html">🌸 Sakura Farm</a>
        <button
          class="navbar-toggler"
          data-bs-toggle="collapse"
          data-bs-target="#n"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-center" id="n">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="products.html">Products</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contact.html">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <div
      class="container-fluid p-5 text-white"
      style="
        background:
          linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)),
          url(&quot;https://picsum.photos/1600/600?nature&quot;) center/cover;
        height: 60vh;
      "
    >
      <div class="container h-100 d-flex align-items-center">
        <div>
          <h1>Fresh From Our Farm</h1>
          <p>Healthy produce every day.</p>
          <a href="products.html" class="btn btn-warning">Shop Products</a>
        </div>
      </div>
    </div>
    <div class="container py-5">
      <h2>Featured Products</h2>
      <div id="featured" class="row g-4"></div>
    </div>
    <script>
      const products = [
        { id: 1, name: "Honeycrisp Apple" },
        { id: 2, name: "Banana" },
        { id: 3, name: "Avocado" },
        { id: 4, name: "Mango" },
        { id: 5, name: "Strawberries" },
        { id: 6, name: "Blueberries" },
        { id: 7, name: "Grapes" },
        { id: 8, name: "Orange" },
      ];
      products
        .sort(() => Math.random() - 0.6)
        .slice(0, 6)
        .forEach(
          (p) =>
            (featured.innerHTML += `<div class="col-md-4"><div class="card"><img src="https://picsum.photos/400/250?random=${p.id}" class="card-img-top"><div class="card-body"><h5>${p.name}</h5><a href="products.html#product-${p.id}" class="btn btn-success">View</a></div></div></div>`),
        );
    </script>
  </body>
</html>
